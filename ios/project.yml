name: MeetingSDKDemo
options:
  bundleIdPrefix: com.meetingsdk
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  MeetingSDKDemo:
    type: application
    platform: iOS
    sources:
      - path: MeetingSDKDemo
    dependencies:
      - framework: ../kmp/build/XCFrameworks/release/MeetingSdkKit.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meetingsdk.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Meeting SDK
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
